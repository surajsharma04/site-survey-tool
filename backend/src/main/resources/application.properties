spring.application.name=backend
server.port=${PORT:${SERVER_PORT:8081}}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/sitesurvey?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQL_USER:sitesurvey}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQL_PASSWORD:SiteSurveyDb2026!}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.open-in-view=${SPRING_JPA_OPEN_IN_VIEW:false}
spring.autoconfigure.exclude=${SPRING_AUTOCONFIGURE_EXCLUDE:org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration}

app.jwtSecret=${APP_JWT_SECRET:sitesurvey-local-jwt-secret-2026-change-before-production-please}
app.jwtExpirationMs=${APP_JWT_EXPIRATION_MS:86400000}
app.jwtRefreshExpirationMs=${APP_JWT_REFRESH_EXPIRATION_MS:604800000}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

minio.url=${MINIO_URL:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:${MINIO_ROOT_USER:sitesurveyminio}}
minio.secret-key=${MINIO_SECRET_KEY:${MINIO_ROOT_PASSWORD:SiteSurveyMinio2026!}}
minio.bucket-name=${MINIO_BUCKET_NAME:sitesurvey-files}
